<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Fond noir style CRT -->
  <rect width="400" height="200" fill="#0a0a0a"/>
  <!-- Scan lines effet CRT -->
  <pattern id="scanlines" x="0" y="0" width="400" height="4" patternUnits="userSpaceOnUse">
    <rect width="400" height="2" fill="#00FF00" opacity="0.03"/>
  </pattern>
  <rect width="400" height="200" fill="url(#scanlines)"/>

  <!-- Icône ordinateur pixel art -->
  <g transform="translate(30, 40)">
    <!-- Écran moniteur -->
    <rect x="0" y="0" width="70" height="52" rx="2" fill="none" stroke="#00FF00" stroke-width="4"/>
    <rect x="6" y="6" width="58" height="38" fill="#001a00"/>
    <!-- Curseur clignotant simulé -->
    <rect x="10" y="12" width="8" height="10" fill="#00FF00"/>
    <rect x="10" y="26" width="38" height="4" fill="#00FF00" opacity="0.7"/>
    <rect x="10" y="34" width="24" height="4" fill="#00FF00" opacity="0.5"/>
    <!-- Pied du moniteur -->
    <rect x="27" y="52" width="16" height="8" fill="#00FF00"/>
    <rect x="18" y="60" width="34" height="5" rx="1" fill="#00FF00"/>
  </g>

  <!-- Texte DATA en pixel font simulé -->
  <text x="120" y="85"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="900"
    fill="#00FF00"
    letter-spacing="6"
    style="text-shadow: 0 0 10px #00FF00">DATA</text>

  <!-- Ligne séparatrice -->
  <rect x="120" y="100" width="252" height="3" fill="#00FF00" opacity="0.6"/>

  <!-- Sous-texte 2000 -->
  <text x="122" y="140"
    font-family="'Courier New', Courier, monospace"
    font-size="38"
    font-weight="700"
    fill="#00CC00"
    letter-spacing="18">2000</text>

  <!-- Tagline -->
  <text x="122" y="168"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#009900"
    letter-spacing="3">SYSTEMES INFORMATIQUES</text>

  <!-- Bordure décorative coin -->
  <rect x="2" y="2" width="396" height="196" fill="none" stroke="#00FF00" stroke-width="1" opacity="0.3"/>
  <rect x="6" y="6" width="388" height="188" fill="none" stroke="#00FF00" stroke-width="1" opacity="0.15"/>
</svg>
