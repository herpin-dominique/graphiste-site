<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Fond blanc -->
  <rect width="400" height="200" fill="#ffffff"/>

  <!-- Icône moderne : losange géométrique avec "D" -->
  <g transform="translate(28, 50)">
    <!-- Forme géométrique hexagone aplati -->
    <polygon points="45,0 90,22 90,68 45,90 0,68 0,22"
      fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <!-- D intérieur épuré -->
    <text x="22" y="64"
      font-family="'Arial', sans-serif"
      font-size="58"
      font-weight="800"
      fill="url(#grad1)">D</text>
  </g>

  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B21A8"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
  </defs>

  <!-- Texte DATA -->
  <text x="138" y="100"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="54"
    font-weight="800"
    fill="url(#grad2)"
    letter-spacing="-1">DATA</text>

  <!-- Accent ligne fine sous DATA -->
  <rect x="138" y="108" width="180" height="2" fill="url(#grad1)" rx="1"/>

  <!-- 2000 fin et espacé -->
  <text x="140" y="145"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="28"
    font-weight="300"
    fill="#64748b"
    letter-spacing="14">2000</text>

  <!-- Tagline minimaliste -->
  <text x="140" y="170"
    font-family="'Arial', sans-serif"
    font-size="10"
    font-weight="400"
    fill="#94a3b8"
    letter-spacing="3.5">SOLUTIONS NUMÉRIQUES</text>
</svg>
