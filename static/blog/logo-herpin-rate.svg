<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Fond blanc générique -->
  <rect width="500" height="500" fill="white"/>

  <!-- Cercle dégradé bleu générique (pas violet, pas la bonne couleur) -->
  <defs>
    <linearGradient id="genericGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
  </defs>
  <circle cx="250" cy="185" r="90" fill="url(#genericGrad)"/>

  <!-- Lettre H en Arial bold -->
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">H</text>

  <!-- Étoiles clipart autour (cliché total) -->
  <text x="155" y="145" font-size="22" font-family="Arial">⭐</text>
  <text x="320" y="120" font-size="16" font-family="Arial">✨</text>
  <text x="310" y="255" font-size="18" font-family="Arial">⭐</text>

  <!-- Nom en Times New Roman (mauvaise police pour un studio créatif) -->
  <text x="250" y="325" font-family="Times New Roman, serif" font-size="28" font-weight="bold" fill="#0288D1" text-anchor="middle" letter-spacing="2">HERPIN</text>

  <!-- Ligne décorative inutile -->
  <line x1="100" y1="345" x2="400" y2="345" stroke="#4FC3F7" stroke-width="2"/>

  <!-- Sous-titre en Comic Sans (le pire choix possible) -->
  <text x="250" y="375" font-family="Comic Sans MS, cursive" font-size="16" fill="#666666" text-anchor="middle">Creative Studio</text>

  <!-- Slogan générique en italique -->
  <text x="250" y="415" font-family="Arial, sans-serif" font-size="13" fill="#999999" text-anchor="middle" font-style="italic">"Your vision, our passion !"</text>

  <!-- Petit clipart pinceau générique -->
  <text x="250" y="460" font-family="Arial" font-size="28" text-anchor="middle">🎨</text>
</svg>
